# CodeQL analysis scope for this repository.
#
# The build under analysis is the ordinary emule target, which necessarily
# compiles every vendored dependency too (cryptopp, mbedtls, id3lib, zlib,
# miniupnpc, resizablelib). CodeQL indexes whatever it observes the compiler
# touch, so without the filter below the results would be dominated by code
# we do not maintain and cannot patch here. Restricting to emule/srchybrid
# keeps the findings actionable: that is the code this repository's patch
# series is allowed to change.
name: "eMule C++"

paths:
  - emule/srchybrid

paths-ignore:
  # Parser.cpp and Scanner.cpp are bison/flex output, committed as generated
  # (emule_build/CMakeLists.txt has a regen_parser target, excluded from the
  # default build, and emule.vcxproj marks the same CustomBuild step
  # ExcludedFromBuild). Findings in them cannot be fixed at the source - only
  # in the .y/.l grammars, or not at all - and they are already carrying
  # /wd5033;/wd5262 for the same reason under /Wall.
  - emule/srchybrid/Parser.cpp
  - emule/srchybrid/Scanner.cpp

# No `queries:` key, deliberately - the analysis runs the default
# code-scanning suite.
#
# The wider suites were measured rather than assumed. The default suite (run
# 33411798169) reported 37 alerts, 19 of them in emule/srchybrid, and found one
# real defect: a format string declaring %u with no argument passed. Widening to
# security-extended (run 33416849097) took that to 368 alerts, 272 in
# emule/srchybrid, and found no new defect at all - the increase was one risk
# class that needs no code change (188 sites whose format string comes from a
# translated language DLL resource, checkable in the resources instead) plus
# four clusters of false positives: the MAKELONG(col, !ascending) sort-flag
# idiom read as a bitwise not, a POSIX file-mode query applied to the Windows
# CRT's _tfsopen, a _tcscpy into a buffer that is exactly the right size, and
# scanf return values that are checked but through CDataExchange::Fail(), which
# throws where CodeQL expects a return.
#
# 272 alerts for zero new defects is not a rate worth triaging, so the extended
# suite stays off.
