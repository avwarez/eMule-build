# MSVC code analysis (/analyze), reported into the same Security tab as CodeQL
# but from a different engine and looking for different things.
#
# CodeQL was measured on this codebase first: its default suite found one real
# defect in 196k lines and its security-extended suite found none beyond that,
# at a cost of 272 alerts to triage. The conclusion was not that the code is
# clean - it is that CodeQL's C++ queries are aimed at a kind of program this
# is not, and that a second opinion had to come from a tool that understands
# the platform. /analyze does: it is the compiler's own path-sensitive engine,
# it reads the SAL annotations that MFC, the CRT and the Windows SDK are
# covered in, and those annotations are what turn a call like memcpy or
# _tcscpy from an opaque call into a checkable contract.
#
# Like the CodeQL workflow, this only ever reports and cannot gate anything.
name: MSVC Code Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - v0.72a-cpp23-fix
    # /analyze roughly triples compile time, so this must not run on every
    # push the way the build workflow does. It runs when the thing being
    # analysed changes (the emule submodule pointer, or the patch series and
    # build definition applied to it) or when the analysis setup itself does.
    paths:
      - '.github/workflows/msvc-analyze.yml'
      - '.github/scripts/merge-analyze-sarif.py'
      - 'emule_build/**'
      - 'emule'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (MSVC /analyze)
    runs-on: windows-latest
    timeout-minutes: 180

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Pin deterministic line endings before checkout
        # See build-windows.yml: the runner image sets core.autocrlf=true, the
        # emule_build patches are generated against LF bytes, and git apply
        # refuses the mismatched context.
        run: git config --global core.autocrlf false

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mbedtls code-gen Python dependencies
        run: pip install -r mbedtls/tf-psa-crypto/scripts/driver.requirements.txt

      - name: Configure (CMake, analysis enabled)
        # x64 only. The analysis reasons about the source, and the findings
        # that genuinely differ by pointer width are the ones /Wall and patch
        # 93 already cover on all three platforms.
        run: cmake -S . -B build -A x64 -DEMULE_CODE_ANALYSIS=ON

      - name: Build under /analyze
        # Release, matching the CodeQL workflow and the shipping configuration.
        # The dependencies are built without /analyze - the option in
        # emule_build/CMakeLists.txt is scoped to the emule target - so most of
        # this step is an ordinary compile and only the 244 emule translation
        # units carry the analysis cost.
        run: cmake --build build --config Release --target emule

      - name: Merge the per-TU SARIF logs
        # if: always() so that a build that fails late still yields the
        # analysis of everything that did compile, which is the more useful
        # outcome than no report at all.
        if: always()
        run: |
          python .github/scripts/merge-analyze-sarif.py `
            --build-dir build `
            --repo-root "${{ github.workspace }}" `
            --output msvc-analyze.sarif

      - name: Collect the raw per-TU logs
        # Kept as an artifact of their own so that a mapping or schema problem
        # in the merge can be reproduced and fixed locally, rather than by
        # re-running the analysis once per hypothesis.
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path raw-analyze | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.sarif |
            ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path raw-analyze $_.Name) -Force }
          Write-Host ("raw logs collected: " + (Get-ChildItem raw-analyze).Count)

      - name: Upload the raw per-TU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-analyze-raw
          path: raw-analyze
          if-no-files-found: warn

      - name: Upload the merged SARIF as a build artifact
        # Independent of the code-scanning upload below: keeps the raw report
        # retrievable even if the upload is rejected, which is how a schema or
        # size problem gets diagnosed without re-running a three-hour build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-analyze-sarif
          path: msvc-analyze.sarif
          if-no-files-found: warn

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: msvc-analyze.sarif
          # Distinct category so this lands alongside the CodeQL results
          # rather than replacing them: code scanning keys an analysis by
          # (tool, category), and two engines reporting into the same one
          # would each close the other's alerts on every run.
          category: "/analysis:msvc"
