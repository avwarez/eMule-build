name: Build eMule (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - v0.72a
      - v0.72a-cpp23

# Two pushes to the same branch in quick succession would otherwise run two
# full matrices in parallel and each publish their own release for it -
# cancel the older run instead so only the latest commit's build ever reaches
# the release job. Keyed on github.ref, so the two release branches never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
        configuration: [Debug, Release]

    steps:
      - name: Pin deterministic line endings before checkout
        # GitHub's windows runner images ship core.autocrlf=true globally, so
        # actions/checkout below would rewrite every source file in the emule
        # submodule to CRLF. The patch files in emule_build/ are generated
        # against the repository's own bytes (LF), and git apply then refuses
        # the mismatched context - confirmed by an actual run, where
        # 30-conformant-parsing.patch failed with "patch does not apply" on
        # srchybrid/QArray.h (the one hunk whose context reaches a file end,
        # and every file in this codebase lacks a trailing newline).
        # Pinning this to false makes the working tree byte-identical to what
        # the patches were generated against. MSVC and rc.exe read LF sources
        # without complaint, so nothing else in the build cares.
        run: git config --global core.autocrlf false

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Report checkout line endings
        # Cheap forensics for the patch-application step below: if a patch
        # ever fails again with "does not apply", the first question is
        # whether the working tree really came out as LF.
        run: |
          git config --get core.autocrlf
          python -c "d=open('emule/srchybrid/QArray.h','rb').read(); print('QArray.h CR count:', d.count(b'\r'), '| ends with newline:', d.endswith(b'\n'))"

      - name: Set up Python
        # Pin an exact interpreter and put it first on PATH, so the "pip
        # install" below and CMake's own find_package(Python3) (used to run
        # mbedtls/tf-psa-crypto's code-gen scripts) resolve to the SAME
        # Python. Without this, plain "pip install jsonschema" installed into
        # a different interpreter than the one CMake found on its own
        # (C:/hostedtoolcache/windows/Python/3.14.6/x64/python3.exe) -
        # confirmed by an actual run: the install step reported success, but
        # the build still failed with ModuleNotFoundError.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mbedtls code-gen Python dependencies
        # Installed from mbedtls's own requirements file rather than named
        # ad-hoc, so this tracks whatever upstream actually needs instead of
        # us guessing/discovering packages one ModuleNotFoundError at a time.
        # Verified which scripts our exact build config runs (GEN_FILES=ON,
        # ENABLE_TESTING=OFF on MSVC): only
        # tf-psa-crypto/scripts/generate_driver_wrappers.py needs third-party
        # packages (jsonschema, jinja2) - everything else invoked
        # (generate_config_checks.py, generate_ssl_debug_helpers.py) is
        # stdlib-only. driver.requirements.txt is exactly those two packages.
        run: pip install -r mbedtls/tf-psa-crypto/scripts/driver.requirements.txt

      - name: Configure (CMake)
        # No -G: let CMake auto-detect whatever Visual Studio version is
        # actually on the runner image, instead of hardcoding a generator
        # name that stops matching once GitHub updates windows-latest to a
        # newer VS release (confirmed the cause of the first run's failure -
        # "could not find any instance of Visual Studio" for a hardcoded
        # "Visual Studio 17 2022" generator).
        #
        # No -T version=... either: pinning to this project's own dev-machine
        # toolset (14.50) was tried and confirmed NOT installed on this runner
        # image (only 14.51.36231 is) - CMake failed fast with a clear "does
        # not seem to be installed" error. cryptopp_build/CMakeLists.txt now
        # detects and works around the one real incompatibility that toolset
        # difference exposed (removed stdext:: array iterator shims), so
        # there's no reason left to fight the runner's own default toolset.
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --target emule

      - name: Build language DLLs
        # The satellite language DLLs (emule/srchybrid/lang/*.rc -> <locale>.dll)
        # are their own EXCLUDE_FROM_ALL target, so they need building
        # explicitly. They land in build/emule_build/<config>/lang/ (next to
        # emule.exe) and are uploaded together with it below, so the release
        # job can assemble the shipping folder (emule.exe + lang/*.dll + the
        # vendored dist/ payload).
        run: cmake --build build --config ${{ matrix.configuration }} --target languages

      - name: Upload build output (emule.exe + language DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: emule-${{ matrix.platform }}-${{ matrix.configuration }}
          # Both paths sit under build/emule_build/<config>/, so that directory
          # is the artifact's common root: the artifact contains emule.exe at
          # its top and a lang/ subfolder of <locale>.dll - the exact shape the
          # release job drops into the staging folder.
          path: |
            build/emule_build/${{ matrix.configuration }}/emule.exe
            build/emule_build/${{ matrix.configuration }}/lang
          if-no-files-found: error
          # These are just short-lived build-verification artifacts (require
          # a GitHub login to download, and would otherwise pile up for 90
          # days). Release-config pushes that get this far also get a public,
          # permanent GitHub Release below with the same binaries attached,
          # so there's no reason to keep those artifact copies around too;
          # Debug configs are never published (see the release job below)
          # and only live here for the 1 day.
          retention-days: 1

  release:
    name: Package (and publish on push)
    needs: build
    # Runs on every event so the per-platform zips are always assembled and
    # attached as workflow artifacts (downloadable for verification, short
    # retention). Only real pushes to a release branch go the extra step and
    # cut a permanent public GitHub Release - manual workflow_dispatch runs
    # (ad-hoc/test builds, e.g. on v0.72a-cpp23-fix) assemble the identical
    # zips but stop at the artifact and never touch the Releases page. That
    # split is enforced per-step below (the "Create GitHub Release" step is
    # push-only), not at the job level. Everything is branch-agnostic (the
    # tag is derived from github.ref_name and the release targets github.sha),
    # so each branch publishes its own independently named releases.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Runs first (before download-artifact below): actions/checkout defaults
      # to `clean: true`, which git-cleans the workspace before checking out -
      # that would delete the downloaded artifacts/release-assets if this ran
      # after them.
      - name: Checkout (with submodules, full history + tags)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # fetch-depth: 0 alone only guarantees full history/tags for the
          # top-level repo. Submodule tags still need an explicit fetch below,
          # since actions/checkout's own submodule clone only fetches
          # refs/heads/* (confirmed locally: `git config --get-all
          # remote.origin.fetch` on a freshly-cloned submodule is just
          # "+refs/heads/*:refs/remotes/origin/*", no tags refspec, and git's
          # automatic tag auto-follow only picks up tags that already point at
          # commits already fetched by that refspec, which excludes tags added
          # on their own after the branch history was written, e.g. a tag
          # created later on an already-published commit).
          fetch-depth: 0

      - name: Fetch submodule tags
        # Belt-and-braces companion to the fetch-depth:0 comment above -
        # explicitly pull every submodule's own tags, not just what
        # auto-follow happened to bring along.
        run: git submodule foreach --recursive 'git fetch --tags --force origin || true'

      - name: Resolve submodule versions
        # Prefer an exact tag match (cryptopp/mbedtls/miniupnp/resizablelib/
        # zlib/emule are all pinned to real tags). avwarez/id3lib pins to a
        # *branch* named v3.9.1 instead of a tag (confirmed locally - no tag
        # object exists there at all, `git tag -l` is empty for that repo) -
        # fall back to any remote branch pointing at the same commit, and
        # only fall back further to the bare short SHA if neither exists.
        run: |
          {
            echo "Automated build from commit ${{ github.sha }}."
            echo
            echo "### Submodule versions"
            echo
            git submodule foreach --quiet '
              ref=$(git describe --tags --exact-match 2>/dev/null)
              if [ -z "$ref" ]; then
                ref=$(git for-each-ref --points-at=HEAD --format="%(refname:short)" refs/remotes/origin | grep -v "^origin/HEAD$" | grep -v "^origin$" | head -1)
                ref=${ref#origin/}
              fi
              sha=$(git rev-parse --short=8 HEAD)
              if [ -z "$ref" ]; then
                echo "- **$name**: \`$sha\`"
              else
                echo "- **$name**: $ref (\`$sha\`)"
              fi
            '
          } > release-notes.md
          cat release-notes.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute release tag
        id: meta
        # Release reference = branch name + UTC generation timestamp, e.g.
        # "v0.72a-20260716-144500" or "v0.72a-cpp23-20260821-144500". Computed
        # once, before packaging, so all per-platform zip filenames and the
        # GitHub Release tag/title carry the exact same stamp; every run gets
        # its own permanent, chronologically sortable identifier instead of one
        # being overwritten by the next.
        run: echo "tag=${{ github.ref_name }}-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Assemble the per-platform release folder and zip it
        # download-artifact restores each of the 6 upload-artifact names
        # (emule-<platform>-<configuration>) as its own subfolder, each now
        # containing emule.exe + a lang/ subfolder of <locale>.dll. Only the
        # *-Release subfolders are shipped - Debug builds are
        # build-verification output (unoptimized, /RTC1 runtime checks
        # enabled) with no reason to reach end users, so they stay as the
        # 1-day artifacts from the build job.
        #
        # Each platform's zip mirrors the layout of the upstream (irwir)
        # eMule binary distribution: a single top-level folder holding
        # emule.exe, a lang/ subfolder of language DLLs, and the
        # platform-independent payload (webserver/, config/, licenses,
        # changelog, readme, templates) vendored once under emule_build/dist/
        # in this repo. emule.exe and the lang DLLs are per-architecture (taken
        # from this platform's build); everything under dist/ is identical across
        # platforms. Zipping the whole folder (zip -r), not a bare .exe -
        # direct .exe download links are routinely blocked by
        # browsers/mail/chat tools, and the extracted folder is ready to run.
        run: |
          mkdir -p release-assets staging
          for dir in artifacts/emule-*-Release/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")                                   # emule-x64-Release
            platform=${name#emule-}; platform=${platform%-Release}    # x64 / Win32 / ARM64
            stage="staging/eMule-${{ github.ref_name }}"
            rm -rf "$stage" && mkdir -p "$stage/lang"
            cp -a emule_build/dist/. "$stage"/                        # vendored payload
            # config/eMule.tmpl is the one dist file that also exists in git:
            # it pairs with this build's web-interface code, so it is taken
            # from the emule submodule (the source of truth) rather than from
            # the vendored upstream snapshot. It is deliberately absent from
            # emule_build/dist/ for that reason.
            cp "emule/srchybrid/webinterface/eMule.tmpl" "$stage/config/eMule.tmpl"
            cp "$dir/emule.exe" "$stage"/                             # this arch's exe
            cp "$dir"/lang/*.dll "$stage/lang"/                       # this arch's 43 DLLs
            ( cd staging && zip -r -q "${GITHUB_WORKSPACE}/release-assets/eMule-${{ steps.meta.outputs.tag }}-${platform}.zip" "eMule-${{ github.ref_name }}" )
          done
          ls -l release-assets
          echo "--- contents of one asset ---"
          unzip -l release-assets/*.zip | head -20

      - name: Upload release zips as workflow artifacts
        # Always (push and workflow_dispatch): makes the assembled per-platform
        # zips downloadable straight from the run, so packaging can be verified
        # on any branch - including v0.72a-cpp23-fix, which never reaches the
        # push-only "Create GitHub Release" step below. Short retention: these
        # are verification copies, and pushes also attach the same zips to a
        # permanent Release.
        uses: actions/upload-artifact@v4
        with:
          name: release-zips-${{ github.ref_name }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        # Push-only: workflow_dispatch runs stop at the downloadable zip
        # artifact above and never create a public Release.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.md \
            --prerelease \
            release-assets/*
