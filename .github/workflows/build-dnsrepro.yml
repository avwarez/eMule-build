name: Build dnsrepro (name-resolution specimen)

# The sixth and last specimen of the dual bench. eMule resolves server names
# with WSAAsyncGetHostByName (UDPSocket.cpp:794), whose answer arrives as a
# WINDOW MESSAGE - the same notification machinery that lost FD_ACCEPT edges
# under Wine - and is written into a buffer owned by a request object whose
# destructor cancels the task and frees it (UDPSocket.cpp:84). The other half
# is the two UDP sockets: datagram boundaries, truncation, and what a datagram
# sent to nobody does to the next receive.
#
# "contract" prints timestamp-free PROBE lines and this workflow DIFFS the two
# tables; "stress" runs many outstanding resolutions at once, over and over,
# and counts the answers. A red cross on the compare step means the bench found
# something, not that the bench is broken.

on:
  workflow_dispatch:
  push:
    paths:
      - 'dnsrepro/**'
      - '.github/workflows/build-dnsrepro.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ARM64, x64, Win32]

    steps:
      - name: Pin deterministic line endings before checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S dnsrepro -B build-dnsrepro -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build-dnsrepro --config Release

      - name: Run the specimen on the runner
        # The control experiment: this IS Windows, so whatever the API does
        # here is by definition what eMule was written against.
        #
        # ARM64 is skipped because an x64 runner cannot execute it - that build
        # exists to be carried to the machine under study.
        if: matrix.platform != 'ARM64'
        shell: bash
        run: |
          set +e
          ./build-dnsrepro/Release/dnsrepro.exe --mode contract > out-contract.txt 2>&1
          echo "contract exit=$?"
          ./build-dnsrepro/Release/dnsrepro.exe --mode stress --rounds 200 > out-stress.txt 2>&1
          echo "stress exit=$?"
          set -e
          cat out-contract.txt
          echo "=============== stress ==============="
          grep -E 'VERDICT|PROBE|totals:|round ' out-stress.txt | tail -20
          # The reference table the Wine job will be compared against, line
          # endings stripped: the Windows run writes CRLF and the Wine run LF.
          grep -h '^PROBE ' out-contract.txt out-stress.txt | sed 's/\r$//' > probes-windows.txt

      - name: Upload dnsrepro.exe
        uses: actions/upload-artifact@v4
        with:
          name: dnsrepro-${{ matrix.platform }}
          path: build-dnsrepro/Release/dnsrepro.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows probe table
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: probes-windows
          path: probes-windows.txt
          if-no-files-found: error
          retention-days: 14

  wine:
    name: Run under Wine (Linux)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: dnsrepro-x64
          path: bin

      - name: Download the Windows probe table
        uses: actions/download-artifact@v4
        with:
          name: probes-windows
          path: ref

      - name: Install Wine
        run: |
          sudo apt-get update -qq
          # The wine metapackage is what registers /usr/bin/wine through the
          # alternatives system; wine64 alone ships the binary somewhere else
          # on this image, so ask for both and then go looking rather than
          # assuming a name.
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb || \
            sudo apt-get install -y --no-install-recommends wine64 xvfb
          WINE=$(command -v wine || command -v wine64 || true)
          if [ -z "$WINE" ]; then
            for c in /usr/lib/wine/wine64 /usr/lib/wine/wine /usr/lib/x86_64-linux-gnu/wine/wine64; do
              [ -x "$c" ] && WINE=$c && break
            done
          fi
          if [ -z "$WINE" ]; then
            echo "no wine binary found; what the packages installed:"
            dpkg -L wine64 2>/dev/null | grep -E 'bin/|wine64$' | head -20
            exit 1
          fi
          echo "WINE=$WINE" >> "$GITHUB_ENV"
          "$WINE" --version

      - name: Create the prefix
        env:
          WINEDEBUG: -all
        run: xvfb-run -a "$WINE" bin/dnsrepro.exe --help > /dev/null 2>&1 || true

      - name: Run the specimen
        env:
          WINEDEBUG: -all
        run: |
          set +e
          xvfb-run -a "$WINE" bin/dnsrepro.exe --mode contract > out-contract.txt 2>&1
          echo "contract exit=$?"
          xvfb-run -a "$WINE" bin/dnsrepro.exe --mode stress --rounds 200 > out-stress.txt 2>&1
          echo "stress exit=$?"
          set -e
          cat out-contract.txt
          echo "=============== stress ==============="
          grep -E 'VERDICT|PROBE|totals:|round ' out-stress.txt | tail -20
          grep -h '^PROBE ' out-contract.txt out-stress.txt | sed 's/\r$//' > probes-wine.txt

      - name: Compare the two tables
        # Windows is the oracle. Nothing here encodes what the right answer is;
        # it only has to notice that the two implementations gave different
        # ones.
        run: |
          if diff -u ref/probes-windows.txt probes-wine.txt > probes.diff; then
            echo "The two implementations answered every probe identically."
          else
            echo "############################################################"
            echo "# DIFFERENCE FOUND - this is the result, not a broken build #"
            echo "############################################################"
            cat probes.diff
            exit 1
          fi
