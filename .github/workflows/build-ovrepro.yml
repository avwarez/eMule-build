name: Build ovrepro (overlapped-send specimen)

# The third specimen of the dual bench, after wsrepro/ and iocprepro/. Same
# shape: one translation unit, its own CMake project, built with the same
# compiler and the same static-MFC configuration as eMule, then run twice -
# once on real Windows and once, with the very same x64 binary, under Wine.
#
# Its "contract" mode prints a fixed table of PROBE lines with no timestamps
# and no run-dependent numbers, and this workflow DIFFS the two tables. Windows
# is the oracle; a difference between them is the finding. A red cross on the
# compare step means the bench found something, not that the bench is broken.
#
# The two stress modes are a different kind of experiment, and neither is
# allowed to fail the job: "emule" reproduces the throttler's two gates and is
# EXPECTED to kill upload slots on both platforms - that is the result - while
# "poll" collects every socket every loop and should kill none anywhere.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ovrepro/**'
      - '.github/workflows/build-ovrepro.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ARM64, x64, Win32]

    steps:
      - name: Pin deterministic line endings before checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S ovrepro -B build-ovrepro -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build-ovrepro --config Release

      - name: Run the specimen on the runner
        # The control experiment: this IS Windows, so whatever the API does
        # here is by definition what eMule was written against.
        #
        # ARM64 is skipped because an x64 runner cannot execute it - that build
        # exists to be carried to the machine under study.
        if: matrix.platform != 'ARM64'
        shell: bash
        run: |
          set +e
          ./build-ovrepro/Release/ovrepro.exe --mode contract > out-contract.txt 2>&1
          echo "contract exit=$?"
          ./build-ovrepro/Release/ovrepro.exe --mode emule --duration-s 60 > out-emule.txt 2>&1
          echo "emule exit=$?"
          ./build-ovrepro/Release/ovrepro.exe --mode poll --duration-s 60 > out-poll.txt 2>&1
          echo "poll exit=$?"
          set -e
          cat out-contract.txt
          echo "=============== emule ==============="
          grep -E 'VERDICT|PROBE|totals:|bytes:|slot ' out-emule.txt
          echo "=============== poll ==============="
          grep -E 'VERDICT|PROBE|totals:|bytes:|slot ' out-poll.txt
          # The reference table the Wine job will be compared against. Line
          # endings are stripped: the Windows run writes CRLF and the Wine run
          # writes LF, which would otherwise report every line as a difference
          # and drown the one that matters.
          grep '^PROBE ' out-contract.txt | sed 's/\r$//' > probes-windows.txt

      - name: Upload ovrepro.exe
        uses: actions/upload-artifact@v4
        with:
          name: ovrepro-${{ matrix.platform }}
          path: build-ovrepro/Release/ovrepro.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows probe table
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: probes-windows
          path: probes-windows.txt
          if-no-files-found: error
          retention-days: 14

  wine:
    name: Run under Wine (Linux)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: ovrepro-x64
          path: bin

      - name: Download the Windows probe table
        uses: actions/download-artifact@v4
        with:
          name: probes-windows
          path: ref

      - name: Install Wine
        run: |
          sudo apt-get update -qq
          # The wine metapackage is what registers /usr/bin/wine through the
          # alternatives system; wine64 alone ships the binary somewhere else
          # on this image, so ask for both and then go looking rather than
          # assuming a name.
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb || \
            sudo apt-get install -y --no-install-recommends wine64 xvfb
          WINE=$(command -v wine || command -v wine64 || true)
          if [ -z "$WINE" ]; then
            for c in /usr/lib/wine/wine64 /usr/lib/wine/wine /usr/lib/x86_64-linux-gnu/wine/wine64; do
              [ -x "$c" ] && WINE=$c && break
            done
          fi
          if [ -z "$WINE" ]; then
            echo "no wine binary found; what the packages installed:"
            dpkg -L wine64 2>/dev/null | grep -E 'bin/|wine64$' | head -20
            exit 1
          fi
          echo "WINE=$WINE" >> "$GITHUB_ENV"
          "$WINE" --version

      - name: Create the prefix
        env:
          WINEDEBUG: -all
        run: xvfb-run -a "$WINE" bin/ovrepro.exe --help > /dev/null 2>&1 || true

      - name: Run the specimen
        env:
          WINEDEBUG: -all
        run: |
          set +e
          xvfb-run -a "$WINE" bin/ovrepro.exe --mode contract > out-contract.txt 2>&1
          echo "contract exit=$?"
          xvfb-run -a "$WINE" bin/ovrepro.exe --mode emule --duration-s 60 > out-emule.txt 2>&1
          echo "emule exit=$?"
          xvfb-run -a "$WINE" bin/ovrepro.exe --mode poll --duration-s 60 > out-poll.txt 2>&1
          echo "poll exit=$?"
          set -e
          cat out-contract.txt
          echo "=============== emule ==============="
          grep -E 'VERDICT|PROBE|totals:|bytes:|slot ' out-emule.txt
          echo "=============== poll ==============="
          grep -E 'VERDICT|PROBE|totals:|bytes:|slot ' out-poll.txt
          grep '^PROBE ' out-contract.txt | sed 's/\r$//' > probes-wine.txt

      - name: Compare the two tables
        # Windows is the oracle. Nothing here encodes what the right answer is;
        # it only has to notice that the two implementations gave different
        # ones.
        run: |
          if diff -u ref/probes-windows.txt probes-wine.txt > probes.diff; then
            echo "The two implementations answered every probe identically."
          else
            echo "############################################################"
            echo "# DIFFERENCE FOUND - this is the result, not a broken build #"
            echo "############################################################"
            cat probes.diff
            exit 1
          fi
