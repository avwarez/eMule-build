name: Build wsrepro (listener reproducer)

# Builds the standalone web-listener reproducer in wsrepro/ with the same
# compiler and the same static-MFC configuration as eMule itself, and leaves
# the exe as a run artifact. It never publishes anything and never touches the
# eMule build: wsrepro/CMakeLists.txt is its own CMake project, configured
# separately from the top-level one.
#
# The reason it has its own workflow rather than a target in the main build is
# turnaround. The eMule matrix is six full builds of eMule plus every vendored
# dependency; this is one translation unit, so a change to the test case comes
# back in a couple of minutes instead of most of an hour.

on:
  workflow_dispatch:
  push:
    paths:
      - 'wsrepro/**'
      - '.github/workflows/build-wsrepro.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # ARM64 is the one that matters for the experiment this was written
        # for - the machine that shows the fault runs Wine on aarch64, whose
        # Wine build is ARM64-only. x64 and Win32 come along because they cost
        # a minute each and make it possible to tell a platform-specific
        # answer from a universal one.
        platform: [ARM64, x64, Win32]

    steps:
      - name: Pin deterministic line endings before checkout
        run: git config --global core.autocrlf false

      - name: Checkout
        # No submodules: wsrepro has no dependency on any of them, nor on the
        # emule sources it imitates.
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S wsrepro -B build-wsrepro -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build-wsrepro --config Release

      - name: Run the reproducer on the runner
        # The whole point of the exercise is to tell a defect in eMule's pattern
        # from a defect in the Winsock underneath it. The runner IS Windows, so
        # running the same binary here is the control experiment: a freeze on
        # this machine indicts the pattern, and no freeze here against a freeze
        # elsewhere indicts the other implementation.
        #
        # ARM64 is skipped because an x64 runner cannot execute it - that build
        # exists to be carried to the machine under study.
        #
        # continue-on-error: a freeze is the finding, not a build failure. The
        # step reports what happened and the workflow goes on to publish the exe.
        if: matrix.platform != 'ARM64'
        continue-on-error: true
        shell: bash
        run: |
          # --delay-ms 20 throttles the clients to roughly 90 connections a second.
          # At full speed the runner runs out of ephemeral ports in about twenty
          # seconds and then spends the trial failing to connect - which reports
          # "no freeze" while never exercising the listener at all. Throttled, a
          # 60-second trial puts several thousand arm/drain cycles through it and
          # stays clear of the TIME_WAIT ceiling.
          for mode in emule asyncselect poll; do
            echo "=============== mode=$mode ==============="
            for i in 1 2 3; do
              set +e
              ./build-wsrepro/Release/wsrepro.exe --mode "$mode" --port 4799 --hammers 2 --delay-ms 20 --duration-s 60 > "out-$mode-$i.txt" 2>&1
              rc=$?
              set -e
              echo "--- trial $i, exit=$rc ---"
              grep -E 'FREEZE:|VERDICT|accepted=' "out-$mode-$i.txt" | tail -6
            done
          done

      - name: Upload wsrepro.exe
        uses: actions/upload-artifact@v4
        with:
          name: wsrepro-${{ matrix.platform }}
          path: build-wsrepro/Release/wsrepro.exe
          if-no-files-found: error
          retention-days: 14

  wine:
    name: Run under Wine (Linux)
    needs: build
    # The other half of the bench. Until now every comparison has been
    # x64-on-Windows against ARM64-on-Wine, which varies the operating system
    # AND the architecture at the same time - so a difference could always have
    # been the architecture rather than the implementation. This job runs the
    # exact same binary the Windows job just ran, under Wine, with the
    # architecture held constant. What is left varying is the one thing being
    # studied.
    #
    # Note the Wine here is whatever the runner image ships, not the 11.0 on
    # the machine the fault was found on. That is a second difference to keep
    # in mind when reading a disagreement between this job and that machine -
    # and it is also useful on its own, since two Wine versions answering
    # differently is itself a finding.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]

    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: wsrepro-${{ matrix.platform }}
          path: bin

      - name: Install Wine
        run: |
          sudo apt-get update -qq
          # The wine metapackage is what registers /usr/bin/wine through the
          # alternatives system; wine64 alone ships the binary somewhere else
          # on this image, so ask for both and then go looking rather than
          # assuming a name.
          sudo apt-get install -y --no-install-recommends wine wine64 xvfb || \
            sudo apt-get install -y --no-install-recommends wine64 xvfb
          WINE=$(command -v wine || command -v wine64 || true)
          if [ -z "$WINE" ]; then
            for c in /usr/lib/wine/wine64 /usr/lib/wine/wine /usr/lib/x86_64-linux-gnu/wine/wine64; do
              [ -x "$c" ] && WINE=$c && break
            done
          fi
          if [ -z "$WINE" ]; then
            echo "no wine binary found; what the packages installed:"
            dpkg -L wine64 2>/dev/null | grep -E 'bin/|wine64$' | head -20
            exit 1
          fi
          echo "WINE=$WINE" >> "$GITHUB_ENV"
          "$WINE" --version

      - name: Create the prefix
        # First run of anything builds the prefix and prints a wall of noise;
        # get that over with before the measured runs, and off the real output.
        env:
          WINEDEBUG: -all
        run: xvfb-run -a "$WINE" bin/wsrepro.exe --help > /dev/null 2>&1 || true

      - name: Run the reproducer
        # Same modes, same command line, same trial count as the Windows job,
        # so the two outputs can be read side by side.
        continue-on-error: true
        env:
          WINEDEBUG: -all
        run: |
          for mode in emule asyncselect poll; do
            echo "=============== mode=$mode ==============="
            for i in 1 2 3; do
              set +e
              xvfb-run -a "$WINE" bin/wsrepro.exe --mode "$mode" --port 4799 --hammers 2 --delay-ms 20 --duration-s 60 > "out-$mode-$i.txt" 2>&1
              rc=$?
              set -e
              echo "--- trial $i, exit=$rc ---"
              grep -E 'FREEZE:|VERDICT|accepted=' "out-$mode-$i.txt" | tail -6
            done
          done
